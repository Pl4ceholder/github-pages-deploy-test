name: Deploy main and dev to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      message:
        description: "ページに表示するデプロイメッセージ"
        required: false
        default: "Manual deployment"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source

      - name: Assemble both environments
        env:
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail

          mkdir -p public/dev

          # main is published at the site root; dev is published under /dev/.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            main-source/ public/

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            dev-source/ public/dev/

          MAIN_SHA="$(git -C main-source rev-parse HEAD)"
          DEV_SHA="$(git -C dev-source rev-parse HEAD)"
          export MAIN_SHA DEV_SHA

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          common = {
              "deployedAt": datetime.now(timezone.utc).isoformat(),
              "runNumber": os.environ["RUN_NUMBER"],
              "actor": os.environ["ACTOR"],
              "event": os.environ["EVENT_NAME"],
              "message": os.environ.get("DEPLOY_MESSAGE") or "Automatic deployment",
          }

          for branch, sha, directory in (
              ("main", os.environ["MAIN_SHA"], "public"),
              ("dev", os.environ["DEV_SHA"], "public/dev"),
          ):
              data = {
                  **common,
                  "branch": branch,
                  "commit": sha[:7],
              }
              with open(f"{directory}/deploy-info.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
